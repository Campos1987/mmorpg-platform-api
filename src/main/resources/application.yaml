spring:
  application:
    name: mmorpg-platform-api
  datasource:
    login:
      url: ${LOGIN_DB_URL}
      username: ${LOGIN_DB_USER}
      password: ${LOGIN_DB_PASS}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 4000

custom:
  security:
    regexp:
      user-name: "^[a-zA-Z0-9]+$"

jwt:
  secret: ${JWT_SECRET_KEY:8fK2vW9xZ4mQ7tN1sJ5cR3vF8xY0eU2iO6pW1bE9zAs=}