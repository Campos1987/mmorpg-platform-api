spring:
  application:
    name: mmorpg-platform-api
  datasource:
    login:
      url: ${LOGIN_DB_URL}
      username: ${LOGIN_DB_USER}
      password: ${LOGIN_DB_PASS}
      driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: 4000
  forward-headers-strategy: native

custom:
  security:
    regexp:
      user-name: "^[a-zA-Z0-9]+$"

jwt:
  secret: ${JWT_SECRET_KEY}