spring:
  application:
    name: mmorpg-platform-api
  datasource:
    url: jdbc:h2:file:~/gk-web-teste
    username: user
    password: 123
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true # Recomendado para você visualizar o banco no navegador
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
      show-sql: true # Útil para ver o que o Hibernate está fazendo
server:
  port: 4000